<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <title>Three-Armed Bandit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 12'%3E%3Ccircle cx='6' cy='6' r='5' fill='%232f6fed'/%3E%3Ccircle cx='18' cy='6' r='5' fill='%23f08c00'/%3E%3Ccircle cx='30' cy='6' r='5' fill='%23d6336c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <p class="score-label" id="score-label">Score</p>
      <p class="score" id="score">0</p>
      <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
      <p class="turns" id="turns">0 / 40 turns</p>
      <div class="slot">
        <p class="hint" id="hint">Each button pays differently. Find the best one.</p>
        <button class="again" id="again" type="button" hidden>Play again</button>
      </div>
    </header>

    <section class="arms" aria-label="Buttons and their reward histories">
      <div class="arm arm-blue">
        <div class="history"><div class="chips" aria-label="Rewards from the blue button, newest first"></div></div>
        <button class="lever" type="button" aria-label="Blue button"></button>
      </div>
      <div class="arm arm-orange">
        <div class="history"><div class="chips" aria-label="Rewards from the orange button, newest first"></div></div>
        <button class="lever" type="button" aria-label="Orange button"></button>
      </div>
      <div class="arm arm-magenta">
        <div class="history"><div class="chips" aria-label="Rewards from the magenta button, newest first"></div></div>
        <button class="lever" type="button" aria-label="Magenta button"></button>
      </div>
    </section>
  </main>

  <script src="bandit.js"></script>
  <script src="app.js"></script>
</body>
</html>
